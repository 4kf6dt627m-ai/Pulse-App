<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: #000;
      position: relative;
    }

    header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(500px, 100%);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #ff0050;
    }

    .feed {
      padding-top: 60px;
      padding-bottom: 75px;
    }

    .video-card {
      height: calc(100vh - 135px);
      min-height: 520px;
      position: relative;
      margin-bottom: 4px;
      overflow: hidden;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      font-size: 70px;
      opacity: .4;
    }

    .info {
      position: absolute;
      left: 15px;
      bottom: 25px;
      right: 75px;
      text-shadow: 0 2px 5px #000;
    }

    .username {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .caption {
      font-size: 15px;
      line-height: 1.4;
    }

    .actions {
      position: absolute;
      right: 12px;
      bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    .action {
      border: none;
      background: transparent;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    .count {
      font-size: 12px;
      margin-top: -14px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(500px, 100%);
      height: 65px;
      background: rgba(0,0,0,.9);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #222;
      z-index: 20;
    }

    nav button {
      background: none;
      border: none;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }

    nav .icon {
      display: block;
      font-size: 24px;
      margin-bottom: 2px;
    }

    .screen {
      display: none;
      padding: 80px 20px 90px;
      min-height: 100vh;
    }

    .screen.active {
      display: block;
    }

    .form {
      max-width: 400px;
      margin: 30px auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #181818;
      color: white;
      outline: none;
    }

    .primary {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #ff0050;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      margin-top: 15px;
      width: 100%;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 10px;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .profile-box {
      text-align: center;
      margin-top: 20px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #333;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .message {
      margin-top: 15px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">PUL<span>S</span>E</div>
    <button class="action" onclick="showScreen('profile')">👤</button>
  </header>

  <!-- FEED -->
  <main id="feed" class="feed">

    <div class="video-card">
      <div class="placeholder">▶</div>

      <div class="info">
        <div class="username">@pulse_creator</div>
        <div class="caption">
          Welcome to Pulse 🎵 Your short-video world starts here.
        </div>
      </div>

      <div class="actions">
        <button class="action" onclick="likeVideo(this)">❤️</button>
        <div class="count">0</div>

        <button class="action">💬</button>
        <div class="count">0</div>

        <button class="action">↗️</button>
      </div>
    </div>

  </main>

  <!-- LOGIN -->
  <section id="login" class="screen">
    <div class="form">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to your Pulse account.</p>

      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Password">

      <button class="primary" onclick="login()">Log In</button>

      <button class="secondary" onclick="showScreen('signup')">
        Create Account
      </button>

      <div id="loginMessage" class="message"></div>
    </div>
  </section>

  <!-- SIGN UP -->
  <section id="signup" class="screen">
    <div class="form">
      <h1>Create Pulse account</h1>
      <p class="subtitle">Join the Pulse community.</p>

      <input id="signupUsername" type="text" placeholder="Username">
      <input id="signupEmail" type="email" placeholder="Email">
      <input id="signupPassword" type="password" placeholder="Password">

      <button class="primary" onclick="signup()">Create Account</button>

      <button class="secondary" onclick="showScreen('login')">
        I already have an account
      </button>

      <div id="signupMessage" class="message"></div>
    </div>
  </section>

  <!-- PROFILE -->
  <section id="profile" class="screen">

    <div class="profile-box">
      <div class="avatar">👤</div>

      <h1 id="profileUsername">@guest</h1>

      <p class="subtitle">
        Welcome to your Pulse profile.
      </p>

      <button class="primary" onclick="showScreen('upload')">
        🎥 Upload Video
      </button>

      <button class="secondary" onclick="logout()">
        Log Out
      </button>
    </div>

  </section>

  <!-- UPLOAD -->
  <section id="upload" class="screen">

    <div class="form">

      <h1>Upload</h1>

      <p class="subtitle">
        Share your video on Pulse.
      </p>

      <input id="videoFile" type="file" accept="video/*">

      <textarea
        id="caption"
        rows="4"
        placeholder="Write a caption..."
      ></textarea>

      <button class="primary" onclick="uploadVideo()">
        Publish Video
      </button>

      <div id="uploadMessage" class="message"></div>

    </div>

  </section>

  <!-- NAVIGATION -->
  <nav>
    <button onclick="showScreen('home')">
      <span class="icon">🏠</span>
      Home
    </button>

    <button onclick="showScreen('login')">
      <span class="icon">🔐</span>
      Login
    </button>

    <button onclick="showScreen('upload')">
      <span class="icon">➕</span>
      Upload
    </button>

    <button onclick="showScreen('profile')">
      <span class="icon">👤</span>
      Profile
    </button>
  </nav>

</div>

<script>

  function showScreen(screen) {

    document.querySelectorAll('.screen').forEach(
      s => s.classList.remove('active')
    );

    document.getElementById('feed').style.display = 'none';

    if (screen === 'home') {
      document.getElementById('feed').style.display = 'block';
      return;
    }

    const target = document.getElementById(screen);

    if (target) {
      target.classList.add('active');
    }
  }

  function likeVideo(button) {

    const count = button.nextElementSibling;

    let number = parseInt(count.innerText);

    number++;

    count.innerText = number;

    button.innerText = '❤️';
  }

  function signup() {

    const username =
      document.getElementById('signupUsername').value;

    const email =
      document.getElementById('signupEmail').value;

    const password =
      document.getElementById('signupPassword').value;

    if (!username || !email || !password) {

      document.getElementById('signupMessage').innerText =
        'Please complete all fields.';

      return;
    }

    document.getElementById('signupMessage').innerText =
      'Supabase connection coming next...';
  }

  function login() {

    const email =
      document.getElementById('loginEmail').value;

    const password =
      document.getElementById('loginPassword').value;

    if (!email || !password) {

      document.getElementById('loginMessage').innerText =
        'Enter your email and password.';

      return;
    }

    document.getElementById('loginMessage').innerText =
      'Supabase connection coming next...';
  }

  function logout() {

    showScreen('home');

  }

  function uploadVideo() {

    const file =
      document.getElementById('videoFile').files[0];

    if (!file) {

      document.getElementById('uploadMessage').innerText =
        'Please choose a video first.';

      return;
    }

    document.getElementById('uploadMessage').innerText =
      'Supabase video storage connection coming next...';
  }

  showScreen('home');

</script>

</body>
</html>
