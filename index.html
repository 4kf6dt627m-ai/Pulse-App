<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #ddd;
      font-size: 25px;
      font-weight: bold;
    }

    .screen {
      display: none;
      padding: 25px;
    }

    .screen.active {
      display: block;
    }

    #feed {
      display: block;
      padding: 20px;
    }

    .logo {
      font-size: 35px;
      font-weight: bold;
      text-align: center;
      margin: 35px 0;
    }

    .post {
      border: 1px solid #ddd;
      border-radius: 15px;
      margin-bottom: 20px;
      padding: 15px;
    }

    .post-video {
      width: 100%;
      height: 300px;
      background: #111;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 50px;
    }

    .caption {
      margin-top: 12px;
      font-size: 16px;
    }

    .actions {
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      margin-top: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .primary {
      width: 100%;
      background: #111;
      color: white;
    }

    .secondary {
      width: 100%;
      background: #eee;
      color: #111;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .form {
      margin-top: 25px;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      text-align: center;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 8px;
      z-index: 10;
    }

    .nav button {
      background: white;
      margin: 0;
      padding: 8px;
      font-size: 13px;
    }

    .profile-box {
      text-align: center;
      padding: 30px 10px;
    }

    .profile-icon {
      font-size: 70px;
    }

    .subtitle {
      color: #666;
      text-align: center;
    }

    body {
      padding-bottom: 70px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    Pulse
  </header>

  <!-- HOME -->
  <main id="feed">
    <div class="logo">🔥 Pulse</div>

    <div class="post">
      <div class="post-video">▶️</div>
      <div class="caption">
        Welcome to Pulse! Your short-video platform.
      </div>

      <div class="actions">
        ❤️ 0 Likes
      </div>
    </div>
  </main>

  <!-- LOGIN -->
  <section id="login" class="screen">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Log in to your Pulse account.
    </p>

    <div class="form">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
      >

      <button class="primary" onclick="login()">
        Log In
      </button>

      <button class="secondary" onclick="showScreen('signup')">
        Create Account
      </button>

      <div id="loginMessage" class="message"></div>

    </div>

  </section>

  <!-- SIGNUP -->
  <section id="signup" class="screen">

    <h1>Create Account</h1>

    <p class="subtitle">
      Join Pulse today.
    </p>

    <div class="form">

      <input
        id="signupEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="Password"
      >

      <button class="primary" onclick="signup()">
        Sign Up
      </button>

      <button class="secondary" onclick="showScreen('login')">
        Back to Login
      </button>

      <div id="signupMessage" class="message"></div>

    </div>

  </section>

  <!-- PROFILE -->
  <section id="profile" class="screen">

    <div class="profile-box">

      <div class="profile-icon">
        👤
      </div>

      <h1 id="profileName">
        Guest
      </h1>

      <p id="profileEmail">
        Not logged in
      </p>

      <button class="primary" onclick="logout()">
        Log Out
      </button>

    </div>

  </section>

  <!-- UPLOAD -->
  <section id="upload" class="screen">

    <h1>Create Post</h1>

    <p class="subtitle">
      Upload your video to Pulse.
    </p>

    <div class="form">

      <input
        id="caption"
        type="text"
        placeholder="Write a caption..."
      >

      <input
        id="videoFile"
        type="file"
        accept="video/*"
      >

      <button class="primary" onclick="createPost()">
        Upload Video
      </button>

      <div id="uploadMessage" class="message"></div>

    </div>

  </section>

  <!-- NAVIGATION -->
  <nav class="nav">

    <button onclick="showScreen('home')">
      🏠<br>
      Home
    </button>

    <button onclick="showScreen('login')">
      🔐<br>
      Login
    </button>

    <button onclick="showScreen('upload')">
      ➕<br>
      Create
    </button>

    <button onclick="showScreen('profile')">
      👤<br>
      Profile
    </button>

  </nav>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://hifggxfzjbtsjpqhconv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_VBtr_LcUsMKEglxDC9M_7w_Lde0mdun";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  function showScreen(screenId) {

    document
      .querySelectorAll(".screen")
      .forEach(screen => {
        screen.classList.remove("active");
      });

    const feed =
      document.getElementById("feed");

    if (screenId === "home") {

      feed.style.display = "block";

    } else {

      feed.style.display = "none";

      const screen =
        document.getElementById(screenId);

      if (screen) {
        screen.classList.add("active");
      }
    }
  }


  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      message.textContent =
        "Please enter your email and password.";

      return;
    }


    message.textContent =
      "Logging in...";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      message.textContent =
        error.message;

      return;
    }


    message.textContent =
      "Login successful! 🎉";


    document.getElementById("profileName")
      .textContent = "Pulse User";

    document.getElementById("profileEmail")
      .textContent = data.user.email;


    showScreen("profile");
  }


  async function signup() {

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const message =
      document.getElementById("signupMessage");


    if (!email || !password) {

      message.textContent =
        "Please enter an email and password.";

      return;
    }


    message.textContent =
      "Creating account...";


    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });


    if (error) {

      message.textContent =
        error.message;

      return;
    }


    message.textContent =
      "Account created successfully! 🎉";

  }


  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("profileName")
      .textContent = "Guest";

    document.getElementById("profileEmail")
      .textContent = "Not logged in";

    showScreen("home");
  }


  function createPost() {

    const caption =
      document.getElementById("caption").value;

    const file =
      document.getElementById("videoFile").files[0];

    const message =
      document.getElementById("uploadMessage");


    if (!file) {

      message.textContent =
        "Please choose a video first.";

      return;
    }


    message.textContent =
      "Video selected. Upload system will be connected next. 🎥";
  }


  showScreen("home");

</script>

</body>
</html>
